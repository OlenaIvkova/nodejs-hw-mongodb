User:
  type: object
  properties:
    id:
      type: string
      description: "Унікальний ідентифікатор користувача."
      example: "60d0fe4f5311236168a109ca"
    name:
      type: string
      description: "Ім’я користувача."
      example: "Іван Іваненко"
    email:
      type: string
      description: "Email користувача."
      example: "ivan@example.com"

Contact:
  type: object
  properties:
    id:
      type: string
      description: "Унікальний ідентифікатор контакту."
      example: "612d1f6e7c1df1548b0e7f90"
    name:
      type: string
      description: "Ім’я контакту."
      example: "Іван"
    phoneNumber:
      type: string
      description: "Номер телефону контакту."
      example: "1234567890"
    email:
      type: string
      description: "Email контакту."
      example: "ivan@example.com"
    isFavourite:
      type: boolean
      description: "Чи є контакт улюбленим."
      example: false
    contactType:
      type: string
      enum:
        - personal
        - work
        - home
        - business
      description: "Тип контакту."
      example: "personal"
    photo:
      type: string
      description: "URL або шлях до фото контакту."
      example: "https://example.com/uploads/photo.jpg"
    createdAt:
      type: string
      format: date-time
      description: "Дата створення контакту."
      example: "2024-04-25T12:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: "Дата останнього оновлення контакту."
      example: "2024-04-26T12:00:00Z"

LoginData:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: "user@example.com"
    password:
      type: string
      format: password
      example: "yourSecurePassword123"

RegisterData:
  type: object
  required:
    - name
    - email
    - password
  properties:
    name:
      type: string
      example: "Test User"
    email:
      type: string
      format: email
      example: "testuser@example.com"
    password:
      type: string
      format: password
      example: "password123"

AuthSuccess:
  type: object
  properties:
    accessToken:
      type: string
      description: "Новий токен доступу."
    refreshToken:
      type: string
      description: "Новий токен оновлення."

SuccessMessage:
  type: object
  properties:
    status:
      type: integer
      example: 200
    message:
      type: string
      example: "Operation completed successfully"

ErrorUnauthorized:
  type: object
  properties:
    status:
      type: integer
      example: 401
    message:
      type: string
      example: "Something went wrong"
    data:
      type: string
      example: "Unauthorized: Unauthorized: No token provided"

ErrorNotFound:
  type: object
  properties:
    status:
      type: integer
      example: 404
    message:
      type: string
      example: "Contact not found"