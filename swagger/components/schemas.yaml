User:
  type: object
  properties:
    _id:
      type: string
      example: "660ff3fadb54d4ca34a43f84"
    email:
      type: string
      example: "user@example.com"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Contact:
  type: object
  properties:
    _id:
      type: string
      example: "66123456db54d4ca34a43f85"
    name:
      type: string
      example: "John Doe"
    email:
      type: string
      example: "johndoe@example.com"
    phone:
      type: string
      example: "+380931112233"
    owner:
      $ref: '#/User'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

LoginData:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      example: "user@example.com"
    password:
      type: string
      format: password
      example: "yourPassword123"

RegisterData:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      example: "newuser@example.com"
    password:
      type: string
      format: password
      example: "securePass!2024"

TokenResponse:
  type: object
  properties:
    accessToken:
      type: string
    refreshToken:
      type: string
    user:
      $ref: '#/User'

ErrorResponse:
  type: object
  properties:
    status:
      type: string
      example: "error"
    code:
      type: integer
      example: 400
    message:
      type: string
      example: "Invalid request"