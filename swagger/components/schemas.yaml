User:
      type: object
      properties:
        id:
          type: string
          description: "Унікальний ідентифікатор користувача."
          example: "60d0fe4f5311236168a109ca"
        name:
          type: string
          description: "Ім’я та прізвище користувача."
          example: "Іван Іваненко"
        email:
          type: string
          description: "Email користувача."
          example: "ivan@example.com"

Contact:
      type: object
      properties:
        id:
          type: string
          description: "Унікальний ідентифікатор контакту."
          example: "612d1f6e7c1df1548b0e7f90"
        name:
          type: string
          description: "Ім’я контакту."
          example: "Іван"
        email:
          type: string
          description: "Email контакту."
          example: "ivan@example.com"
        phone:
          type: string
          description: "Номер телефону контакту."
          example: "+380501234567"
        photo:
          type: string
          description: "URL або шлях до фото контакту (якщо додано)."
          example: "https://example.com/uploads/612d1f6e7c1d_photo.jpg"

LoginUser:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      example: "user@example.com"
    password:
      type: string
      format: password
      example: "yourPassword123"

NewContact:
  type: object
  required:
    - name
    - email
    - phone
  properties:
    name:
      type: string
      example: "John Doe"
    email:
      type: string
      example: "johndoe@example.com"
    phone:
      type: string
      example: "+380931112233"

UpdateContact:
  type: object
  properties:
    name:
      type: string
      example: "John Doe"
    email:
      type: string
      example: "johndoe@example.com"
    phone:
      type: string
      example: "+380931112233"
  description: Fields to update. At least one field must be provided.

LoginData:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      example: "user@example.com"
    password:
      type: string
      format: password
      example: "yourPassword123"

RegisterUser:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      example: "newuser@example.com"
    password:
      type: string
      format: password
      example: "securePass!2024"

TokenResponse:
  type: object
  properties:
    accessToken:
      type: string
    refreshToken:
      type: string
    user:
      $ref: '#/User'

ErrorResponse:
  type: object
  properties:
    status:
      type: string
      example: "error"
    code:
      type: integer
      example: 400
    message:
      type: string
      example: "Invalid request"

SuccessMessage:
  type: object
  properties:
    status:
      type: string
      example: "success"
    message:
      type: string
      example: "Operation completed successfully"

RegisterData:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: user@example.com
    password:
      type: string
      format: password
      minLength: 6
      example: yourSecurePassword123

AuthSuccess:
  type: object
  properties:
    accessToken:
      type: string
      description: New access token for the user.
    refreshToken:
      type: string
      description: New refresh token for the user.
  required:
    - accessToken
    - refreshToken

Error:
      type: object
      properties:
        statusCode:
          type: integer
          description: "HTTP-код помилки."
          example: 401
        message:
          type: string
          description: "Повідомлення про помилку."
          example: "Unauthorized"