tags:
  - Auth
summary: "Реєстрація нового користувача"
operationId: registerUser
description: "Створення облікового запису нового користувача."
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/RegisterData'
responses:
  '201':
    description: "Користувача успішно зареєстровано."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "User successfully registered"
            data:
              $ref: '../../components/schemas.yaml#/User'
  '400':
    description: "Невірний ввід або користувач вже існує."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorUnauthorized'