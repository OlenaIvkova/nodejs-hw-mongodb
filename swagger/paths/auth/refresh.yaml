tags:
  - Auth
summary: "Оновити токен доступу"
operationId: refreshToken
description: "Генерація нового токена доступу на основі refresh токена."
security:
  - bearerAuth: []
responses:
  '200':
    description: "Токен успішно оновлено."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/AuthSuccess'
  '401':
    description: "Невалідний або прострочений токен оновлення."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorUnauthorized'