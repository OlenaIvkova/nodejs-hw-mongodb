tags:
  - Auth
summary: Refresh access token
operationId: refreshToken
description: Generate new access token using a refresh token stored in HTTP-only cookie.
security:
  - bearerAuth: []  
responses:
  '200':
    description: Token successfully refreshed
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/AuthSuccess'
  '401':
    description: Invalid or expired refresh token
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorResponse'