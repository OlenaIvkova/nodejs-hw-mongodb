tags:
  - Auth
summary: "Вихід користувача"
operationId: logoutUser
description: "Вихід користувача шляхом інвалідації токенів."
security:
  - bearerAuth: []
responses:
  '200':
    description: "Успішний вихід."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Logout successful"
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorUnauthorized'