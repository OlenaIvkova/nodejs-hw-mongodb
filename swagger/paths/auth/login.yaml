tags:
  - Auth
summary: "Вхід користувача"
operationId: loginUser
description: "Автентифікація користувача та повернення токенів."
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/LoginData'
responses:
  '200':
    description: "Успішний вхід."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/AuthSuccess'
  '401':
    description: "Невірні облікові дані."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorUnauthorized'

