tags:
  - Auth
summary: Логін користувача
operationId: loginUser
description: >
  Цей ендпоінт дозволяє користувачеві увійти в систему, використовуючи електронну адресу та пароль.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
          password:
            type: string
responses:
  '200':
    description: Логін успішний
    content:
      application/json:
        schema:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
  '400':
    description: Невірні дані
  '401':
    description: Невірний логін або пароль