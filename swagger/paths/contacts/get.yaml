tags:
  - Contacts
summary: "Отримати список контактів"
description: "Повертає список контактів з підтримкою пагінації та сортування."
operationId: getAllContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    description: "Номер сторінки для пагінації."
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
    description: "Кількість контактів на сторінку."
  - in: query
    name: sortBy
    schema:
      type: string
      default: "createdAt"
    description: "Поле для сортування."
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: desc
    description: "Порядок сортування."
responses:
  '200':
    description: "Успішне отримання контактів."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contacts!"
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas.yaml#/Contact'
                page:
                  type: integer
                perPage:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
                hasPreviousPage:
                  type: boolean
                hasNextPage:
                  type: boolean
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorUnauthorized'

