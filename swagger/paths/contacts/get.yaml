tags:
  - Contacts
summary: "Отримати список контактів"
description: "Повертає список контактів з підтримкою пагінації та сортування. Доступ лише для авторизованих користувачів."
operationId: getAllContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
    description: "Номер сторінки (для пагінації)."
    example: 1
  - in: query
    name: limit
    schema:
      type: integer
    description: "Кількість контактів на сторінку."
    example: 10
  - in: query
    name: sortBy
    schema:
      type: string
    description: "Поле, за яким здійснюється сортування контактів (наприклад, 'name', 'email')."
    example: "name"
responses:
  '200':
    description: "Список контактів отримано успішно."
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas.yaml#/Contact'
  '401':
    description: "Неавторизовано. Невірний або відсутній токен доступу."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/Error'
        example:
          statusCode: 401
          message: "Unauthorized"

