tags:
  - Contacts
summary: Отримати всі контакти
operationId: getContacts
description: >
  Цей ендпоінт повертає список усіх контактів користувача. 
  Параметри запиту дозволяють здійснювати пагінацію та сортування.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      default: 1
    description: Номер сторінки для пагінації
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      default: 10
    description: Кількість елементів на сторінці
  - in: query
    name: sortBy
    required: false
    schema:
      type: string
    description: Поле для сортування
responses:
  '200':
    description: Список контактів
    content:
      application/json:
        schema:
          type: array
          items:
$ref: '../components/schemas.yaml#/Contact'
'401':
    description: Користувач не авторизований