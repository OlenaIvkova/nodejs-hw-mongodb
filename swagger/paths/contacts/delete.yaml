tags:
  - Contacts
summary: Видалити контакт
operationId: deleteContact
description: >
  Цей ендпоінт дозволяє видалити контакт за його ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: ID контакту
responses:
  '204':
    description: Контакт видалено
  '404':
    description: Контакт не знайдений