tags:
  - Contacts
summary: "Створити новий контакт"
description: "Створює новий контакт для авторизованого користувача."
operationId: createContact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phoneNumber:
            type: string
          contactType:
            type: string
            enum: [personal, work, home, business]
          isFavourite:
            type: boolean
responses:
  '201':
    description: "Контакт успішно створено."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Contact successfully created"
            data:
              $ref: '../../components/schemas.yaml#/Contact'
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorUnauthorized'

