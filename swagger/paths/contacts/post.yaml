tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact in the system.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/NewContact'
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/Contact'
  '400':
    description: Invalid input
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorResponse'