tags:
  - Contacts
summary: "Створити новий контакт"
description: "Створює новий контакт для авторизованого користувача."
operationId: createContact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            description: "Ім’я контакту."
          email:
            type: string
            format: email
            description: "Email контакту."
          phoneNumber:
            type: string
            description: "Номер телефону контакту."
          contactType:
            type: string
            enum: [personal, work, home, business]
            description: "Тип контакту."
          isFavourite:
            type: boolean
            description: "Чи є контакт улюбленим."
          photo:
            type: string
            format: binary
            description: "Фото контакту."
responses:
  '201':
    description: "Контакт успішно створено."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Contact successfully created"
            data:
              $ref: '../../components/schemas.yaml#/Contact'
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ErrorUnauthorized'

