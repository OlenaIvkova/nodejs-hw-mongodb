tags:
  - Contacts
summary: "Отримати контакт за ID"
description: "Повертає детальну інформацію про контакт."
operationId: getContactById
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: "Унікальний ідентифікатор контакту."
responses:
  '200':
    description: "Інформація про контакт."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            data:
              $ref: '../../../components/schemas.yaml#/Contact'
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorUnauthorized'
  '404':
    description: "Контакт не знайдено."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorNotFound'