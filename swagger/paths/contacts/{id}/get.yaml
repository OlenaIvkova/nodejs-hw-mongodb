tags:
  - Contacts
summary: "Отримати контакт за ID"
description: "Повертає детальну інформацію про контакт за його унікальним ідентифікатором."
operationId: getContactById
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: "Унікальний ідентифікатор контакту."
responses:
  '200':
    description: "Інформація про контакт."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Contact'
  '401':
    description: "Неавторизовано. Немає доступу до ресурсу."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Error'
        example:
          statusCode: 401
          message: "Unauthorized"
  '404':
    description: "Контакт не знайдено."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Error'
        example:
          statusCode: 404
          message: "Not Found"

