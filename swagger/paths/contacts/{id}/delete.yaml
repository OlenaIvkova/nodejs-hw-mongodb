tags:
  - Contacts
summary: "Видалити контакт"
description: "Видаляє контакт за ID."
operationId: deleteContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
responses:
  '204':
    description: "Контакт успішно видалено. Немає тіла відповіді."
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorUnauthorized'
  '404':
    description: "Контакт не знайдено."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorNotFound'

