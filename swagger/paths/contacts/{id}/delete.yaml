tags:
  - Contacts
summary: "Видалити контакт"
description: "Видаляє контакт за ID."
operationId: deleteContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
responses:
  '200':
    description: "Контакт успішно видалено."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Contact successfully deleted"
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorUnauthorized'
  '404':
    description: "Контакт не знайдено."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorNotFound'

