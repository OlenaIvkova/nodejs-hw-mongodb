tags:
  - Contacts
summary: "Видалити контакт"
description: "Видаляє контакт за вказаним ідентифікатором. Доступ лише для авторизованих користувачів."
operationId: deleteContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: "Ідентифікатор контакту, який видаляється."
responses:
  '200':
    description: "Контакт успішно видалено."
  '401':
    description: "Неавторизовано. Немає доступу до ресурсу."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Error'
        example:
          statusCode: 401
          message: "Unauthorized"
  '404':
    description: "Контакт не знайдено. Ймовірно, вже видалений або невірний ID."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Error'
        example:
          statusCode: 404
          message: "Not Found"

