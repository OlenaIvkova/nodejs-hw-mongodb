tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: Delete a contact by ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
responses:
  '200':
    description: Contact successfully deleted
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/SuccessMessage'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorResponse'