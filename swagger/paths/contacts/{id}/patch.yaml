tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update an existing contact by ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas.yaml#/UpdateContact'
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Contact'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorResponse'