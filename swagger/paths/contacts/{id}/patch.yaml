tags:
  - Contacts
summary: "Оновити контакт"
description: "Оновлює вказаний контакт за ідентифікатором. Підтримується оновлення одного або декількох полів."
operationId: updateContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: "Ідентифікатор контакту, який оновлюється."
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Нове ім’я контакту."
          email:
            type: string
            format: email
            description: "Новий email контакту."
          phone:
            type: string
            description: "Новий номер телефону контакту."
          photo:
            type: string
            format: binary
            description: "Нове фото контакту (файл)."
responses:
  '200':
    description: "Контакт успішно оновлено."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Contact'
  '400':
    description: "Помилка запиту. Невірні дані для оновлення."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Error'
        example:
          statusCode: 400
          message: "Bad Request"
  '401':
    description: "Неавторизовано. Немає доступу до ресурсу."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Error'
        example:
          statusCode: 401
          message: "Unauthorized"
  '404':
    description: "Контакт не знайдено."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/Error'
        example:
          statusCode: 404
          message: "Not Found"

