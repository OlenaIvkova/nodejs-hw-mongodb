tags:
  - Contacts
summary: "Оновити контакт"
description: "Оновлює контакт за ID."
operationId: updateContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
          phoneNumber:
            type: string
          contactType:
            type: string
            enum: [personal, work, home, business]
          isFavourite:
            type: boolean
responses:
  '200':
    description: "Контакт оновлено успішно."
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Contact successfully updated"
            data:
              $ref: '../../../components/schemas.yaml#/Contact'
  '401':
    description: "Неавторизований доступ."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorUnauthorized'
  '404':
    description: "Контакт не знайдено."
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/ErrorNotFound'
          
