tags:
  - Contacts
summary: Отримати контакт за ID
operationId: getContactById
description: >
  Цей ендпоінт дозволяє отримати інформацію про контакт за його ID.
  Використовується авторизація за допомогою Bearer токену.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: ID контакту
responses:
  '200':
    description: Контакт знайдений
    content:
      application/json:
        schema:
$ref: '../components/schemas.yaml#/Contact'
'404':
    description: Контакт не знайдений