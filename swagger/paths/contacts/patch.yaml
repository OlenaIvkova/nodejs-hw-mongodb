patch:
  tags:
    - Contacts
  summary: Оновити контакт
  operationId: updateContact
  description: >
    Цей ендпоінт дозволяє оновити контакт за його ID. Потрібно вказати ID та нові дані контакту.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
      description: ID контакту
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
  responses:
    '200':
      description: Контакт оновлено
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Contact'
    '404':
      description: Контакт не знайдений
    '400':
      description: Невірні дані