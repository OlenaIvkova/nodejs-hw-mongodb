openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: API для роботи з контактами та авторизацією користувачів.

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-jwe2.onrender.com

tags:
  - name: Contacts
    description: CRUD операції з контактами
  - name: Auth
    description: Авторизація та сесії користувачів

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml

  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.yaml

  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.yaml

  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout.yaml

  /auth/refresh:
    get:
      $ref: ../swagger/paths/auth/refresh.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Contact:
      $ref: '../swagger/components/schemas.yaml#/Contact'
    LoginData:
      $ref: '../swagger/components/schemas.yaml#/LoginData'
    RegisterData:
      $ref: '../swagger/components/schemas.yaml#/RegisterData'
    AuthSuccess:
      $ref: '../swagger/components/schemas.yaml#/AuthSuccess'
    SuccessMessage:
      $ref: '../swagger/components/schemas.yaml#/SuccessMessage'
    ErrorUnauthorized:
      $ref: '../swagger/components/schemas.yaml#/ErrorUnauthorized'
    ErrorNotFound:
      $ref: '../swagger/components/schemas.yaml#/ErrorNotFound'