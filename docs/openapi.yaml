openapi: 3.0.3
info:
  version: 1.0.0
  title: Contact Manager API
  description: >
    Бекенд-додаток для управління контактами користувача з аутентифікацією, 
    авторизацією та завантаженням фото.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:3001
  - url: https://nodejs-hw-mongodb-jwe2.onrender.com

tags:
  - name: Auth
    description: Реєстрація, вхід, вихід, оновлення сесії
  - name: User
    description: Отримання поточного користувача
  - name: Contacts
    description: CRUD операції з контактами користувача
  - name: Upload
    description: Завантаження або оновлення фото для контакта

paths:
  /api/auth/register:
    $ref: "../swagger/paths/auth/register.yaml"

  /api/auth/login:
    $ref: "../swagger/paths/auth/login.yaml"

  /api/contacts:
    get:
      $ref: "../swagger/paths/contacts/get.yaml"
    post:
      $ref: "../swagger/paths/contacts/post.yaml"

  /api/contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
    get:
      $ref: "../swagger/paths/contacts/{contactId}/get.yaml"
    patch:
      $ref: "../swagger/paths/contacts/patch.yaml"
    delete:
      $ref: "../swagger/paths/contacts/delete.yaml"

  /api/contacts/{contactId}/photo:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
    patch:
      $ref: "../swagger/paths/contacts/{contactId}/photo.yaml"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    $ref: "../swagger/components/schemas.yaml"